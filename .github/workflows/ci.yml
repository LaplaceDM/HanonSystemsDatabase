name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Runtime libs pyodbc needs; msodbcsql18 is optional for 'check' and may not exist on all Ubuntu images
      - name: System deps for pyodbc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc unixodbc-dev
          # Try to install Microsoft ODBC Driver 18 (non-fatal if not available on this runner)
          sudo apt-get install -y curl gnupg || true
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add - || true
          . /etc/os-release
          echo "deb [arch=amd64] https://packages.microsoft.com/ubuntu/${VERSION_ID}/prod ${UBUNTU_CODENAME} main" | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null || true
          sudo apt-get update || true
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 || true

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff lint
        run: |
          ruff check .
          # If you only want to lint a subset, you can do: ruff check HanonSystemsApp/

      # IMPORTANT: run manage.py from the folder where manage.py actually lives
      - name: Django system check
        working-directory: HanonSystemsApp
        env:
          # Provide a minimal environment in case your settings import reads these
          SECRET_KEY: "ci-only-secret"
          DEBUG: "0"
        run: |
          python manage.py check --no-input
