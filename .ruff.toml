# .ruff.toml
line-length = 120
target-version = "py311"

extend-select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RET", # flake8-return
  "RUF", # ruff rules
]

[per-file-ignores]
"*/migrations/*" = ["E501", "F401", "F403"]
