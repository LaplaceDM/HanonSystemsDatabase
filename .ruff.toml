# .ruff.toml（仅保留根目录这一份）
line-length = 120
target-version = "py311"

[lint]
# 启用的规则集
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RET", # flake8-return
  "RUF", # ruff 专有
]

# 逐文件忽略（注意：这是“表”，不是 { ... } 内联表）
[lint.per-file-ignores]
"HanonSystemsApp/HanonSystemsApp/settings.py" = ["E402"]

# 你当前项目里大量使用 import *、类属性为可变等，先放过以保证 CI 能跑通；
# 后续可逐步修复这些代码，再把这些忽略去掉。
"HanonSystemsApp/database/forms.py"   = ["F403", "F405", "RUF012", "E501", "UP008"]
"HanonSystemsApp/database/filters.py" = ["F403", "F405", "RUF012", "E501"]

# 迁移目录常见长行/未用导入等全部忽略
"*/migrations/*" = ["E501", "F401", "F403", "F405"]
