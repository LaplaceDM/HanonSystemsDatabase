# .ruff.toml（根目录）
line-length = 120
target-version = "py311"

[lint]
# 你要启用的规则集合
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RET", # flake8-return
  "RUF", # ruff 专有
]

# 对特定文件关闭一些规则，让 CI 先能过
per-file-ignores = {
  # settings.py 顶部有运行代码在 import 之前，忽略 E402
  "HanonSystemsApp/HanonSystemsApp/settings.py" = ["E402"],

  # 你现在用的是 from .models import * 以及类属性可变等，先放过
  "HanonSystemsApp/database/forms.py" = ["F403", "F405", "RUF012", "E501", "UP008"],
  "HanonSystemsApp/database/filters.py" = ["F403", "F405", "RUF012", "E501"],

  # 迁移目录一律放过常见问题
  "*/migrations/*" = ["E501", "F401", "F403", "F405"],
}
