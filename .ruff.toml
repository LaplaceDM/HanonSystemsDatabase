# .ruff.toml（根目录）
line-length = 120
target-version = "py311"

[lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RET", # flake8-return
  "RUF", # ruff 专有
]

[lint.per-file-ignores]
# 你的 settings.py 在 import 前有运行代码，放过 E402
"HanonSystemsApp/HanonSystemsApp/settings.py" = ["E402"]

# 现阶段先放过 forms/filters 里的一些规则，让 CI 能跑通
"HanonSystemsApp/database/forms.py"   = ["F403", "F405", "RUF012", "E501", "UP008"]
"HanonSystemsApp/database/filters.py" = ["F403", "F405", "RUF012", "E501"]

# 迁移目录：忽略长行/未用导入/星号导入/可变类属性等（新增 RUF012）
"*/migrations/*" = ["E501", "F401", "F403", "F405", "RUF012"]
