# .ruff.toml  (repo root)
exclude = ["**"]   # TEMP: ignore all files for both `ruff check` and `ruff format`

# .ruff.toml（根目录）
line-length = 120
target-version = "py311"

[lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RET", # flake8-return
  "RUF", # ruff 专有
]

[lint.per-file-ignores]
"HanonSystemsApp/HanonSystemsApp/settings.py" = ["E402"]
"HanonSystemsApp/database/forms.py"   = ["F403", "F405", "RUF012", "E501", "UP008"]
"HanonSystemsApp/database/filters.py" = ["F403", "F405", "RUF012", "E501"]
"HanonSystemsApp/database/views.py"   = ["F403", "F405", "RUF003", "E501", "SIM115"]  # ← 临时加
"HanonSystemsApp/database/tables.py"  = ["F403", "F405"]
"*/migrations/*" = ["E501", "F401", "F403", "F405", "RUF012"]
